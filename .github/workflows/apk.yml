name: APK Android

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        working-directory: android
        run: gradle :app:assembleDebug :prueba:assembleDebug --no-daemon --stacktrace

      - name: Preparar archivo
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk SenalesXAU.apk
          cp android/prueba/build/outputs/apk/debug/prueba-debug.apk PruebaIsla.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ github.run_number }}
          name: Señales XAU v1.0.${{ github.run_number }}
          body: |
            APK de la app de señales. Descarga **SenalesXAU.apk** e instálala en el móvil.
            Enlace fijo a la última versión: https://github.com/${{ github.repository }}/releases/latest/download/SenalesXAU.apk
          files: |
            SenalesXAU.apk
            PruebaIsla.apk
          make_latest: true
